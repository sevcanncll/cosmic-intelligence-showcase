<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbit Rings -->
  <circle cx="50" cy="50" r="40" stroke="url(#iconGradient)" stroke-width="2" stroke-dasharray="6 5" opacity="0.85" />
  <ellipse cx="50" cy="50" rx="44" ry="18" stroke="#00E5FF" stroke-width="1.2" transform="rotate(-30 50 50)" opacity="0.65" />
  
  <!-- Core Diamond Star -->
  <polygon points="50,14 60,40 86,50 60,60 50,86 40,60 14,50 40,40" fill="url(#iconGradient)" filter="url(#iconGlow)" opacity="0.95" />
  
  <!-- Core White Dot -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
  
  <!-- Satellites -->
  <circle cx="80" cy="28" r="3.5" fill="#00E5FF" />
  <circle cx="20" cy="72" r="2.5" fill="#FFD700" />
</svg>
