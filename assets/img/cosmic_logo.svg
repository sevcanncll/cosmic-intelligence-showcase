<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullCosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="fullGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="42" stroke="url(#fullCosmicGrad)" stroke-width="2.2" stroke-dasharray="6 5" opacity="0.85" />
    <ellipse cx="50" cy="50" rx="46" ry="19" stroke="#00E5FF" stroke-width="1.2" transform="rotate(-30 50 50)" opacity="0.6" />
    <polygon points="50,12 61,39 88,50 61,61 50,88 39,61 12,50 39,39" fill="url(#fullCosmicGrad)" filter="url(#fullGlow)" opacity="0.95" />
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
    <circle cx="82" cy="26" r="3.5" fill="#00E5FF" />
    <circle cx="18" cy="74" r="2.5" fill="#FFD700" />
  </g>

  <!-- Brand Typography with Wide ViewBox -->
  <g transform="translate(130, 0)">
    <text x="0" y="55" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="3">
      COSMIC <tspan fill="#00E5FF">INTELLIGENCE</tspan>
    </text>
    <text x="2" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#93C5FD" letter-spacing="3" opacity="0.95">
      AI POTENTIAL &amp; LEADERSHIP PROFILER
    </text>
  </g>
</svg>
