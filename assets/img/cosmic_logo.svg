<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cosmicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Orbit Rings -->
    <circle cx="42" cy="42" r="36" stroke="url(#cosmicGradient)" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.8" />
    <ellipse cx="42" cy="42" rx="38" ry="16" stroke="#00E5FF" stroke-width="1" transform="rotate(-30 42 42)" opacity="0.6" />
    
    <!-- Core Diamond Star -->
    <polygon points="42,12 50,34 72,42 50,50 42,72 34,50 12,42 34,34" fill="url(#cosmicGradient)" filter="url(#glowEffect)" opacity="0.95" />
    
    <!-- Core White Spark -->
    <circle cx="42" cy="42" r="4.5" fill="#FFFFFF" />
    
    <!-- Planetary Satellite Dots -->
    <circle cx="68" cy="24" r="3" fill="#00E5FF" />
    <circle cx="16" cy="60" r="2" fill="#FFD700" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(110, 0)">
    <text x="0" y="46" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
      COSMIC <tspan fill="#00E5FF">INTELLIGENCE</tspan>
    </text>
    <text x="2" y="70" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#93C5FD" letter-spacing="3.8" opacity="0.9">
      AI POTENTIAL &amp; LEADERSHIP PROFILER
    </text>
  </g>
</svg>
